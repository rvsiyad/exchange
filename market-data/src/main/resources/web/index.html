<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>exchange · demo</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --buy:#3fb950; --sell:#f85149; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:16px; }
  h1 { font-size:16px; margin-bottom:2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  #feed { display:inline-block; margin-left:8px; }
  #feed::before { content:'●'; margin-right:4px; }
  #feed.live { color:var(--buy); }
  #feed.down { color:var(--sell); }
  .cols { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:8px; }
  #ticket { width:220px; }
  #ticket label { display:block; font-size:12px; color:var(--dim); margin:8px 0 2px; }
  #ticket input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; color:var(--text); padding:6px; font:inherit; }
  .sides { display:flex; gap:6px; margin-top:4px; }
  .sides button { flex:1; padding:6px; border-radius:4px; border:1px solid var(--line); background:var(--bg); color:var(--dim); font:inherit; cursor:pointer; }
  .sides button.buy.on { background:var(--buy); border-color:var(--buy); color:#04260d; font-weight:bold; }
  .sides button.sell.on { background:var(--sell); border-color:var(--sell); color:#330503; font-weight:bold; }
  #place { width:100%; margin-top:12px; padding:8px; border:0; border-radius:4px; background:#1f6feb; color:#fff; font:inherit; font-weight:bold; cursor:pointer; }
  #status { font-size:12px; color:var(--dim); margin-top:8px; min-height:18px; }
  #book { width:260px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:1px 6px; text-align:right; font-variant-numeric:tabular-nums; }
  .lvl { position:relative; }
  .lvl .bar { position:absolute; right:0; top:1px; bottom:1px; opacity:.15; }
  .ask td.px { color:var(--sell); } .bid td.px { color:var(--buy); }
  .ask .bar { background:var(--sell); } .bid .bar { background:var(--buy); }
  #spread { text-align:center; color:var(--dim); font-size:12px; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:3px 0; margin:4px 0; }
  #trades { width:220px; }
  #trades td:first-child { text-align:left; }
  #balances { width:240px; }
  #bal td:first-child { text-align:left; color:var(--dim); }
  #bal .avail { color:var(--text); }
  #mine li { list-style:none; font-size:12px; color:var(--dim); display:flex; justify-content:space-between; gap:8px; margin-top:4px; }
  #mine button { background:none; border:1px solid var(--line); border-radius:4px; color:var(--dim); font:inherit; font-size:11px; cursor:pointer; }
</style>
</head>
<body>
<h1>exchange</h1>
<div class="sub">BTC-USD · gateway → kafka → engine → kafka → market-data · funds in TigerBeetle
  <span id="feed" class="down">connecting</span></div>
<div class="cols">
  <div class="panel" id="ticket">
    <h2>Order ticket</h2>
    <label>Trader</label><input id="user" value="alice">
    <div class="sides">
      <button class="buy on" id="btnBuy">BUY</button>
      <button class="sell" id="btnSell">SELL</button>
    </div>
    <label>Limit price ($)</label><input id="price" value="100.00" inputmode="decimal">
    <label>Quantity</label><input id="qty" value="1" inputmode="numeric">
    <button id="place">Place order</button>
    <div id="status"></div>
    <ul id="mine"></ul>
  </div>
  <div class="panel" id="book">
    <h2>Order book</h2>
    <table><tbody id="asks"></tbody></table>
    <div id="spread">—</div>
    <table><tbody id="bids"></tbody></table>
  </div>
  <div class="panel" id="trades">
    <h2>Trades</h2>
    <table><tbody id="tape"></tbody></table>
  </div>
  <div class="panel" id="balances">
    <h2>Balances</h2>
    <table>
      <tbody id="bal"></tbody>
    </table>
  </div>
</div>
<script>
  const SYMBOL = 'BTC-USD';
  const DEPTH = 10, TAPE = 20;
  let side = 'BUY';
  const $ = id => document.getElementById(id);
  const dollars = t => (t / 100).toFixed(2);

  $('btnBuy').onclick = () => { side = 'BUY'; $('btnBuy').classList.add('on'); $('btnSell').classList.remove('on'); };
  $('btnSell').onclick = () => { side = 'SELL'; $('btnSell').classList.add('on'); $('btnBuy').classList.remove('on'); };

  $('place').onclick = async () => {
    const priceTicks = Math.round(parseFloat($('price').value) * 100);
    const quantity = parseInt($('qty').value, 10);
    const res = await fetch('/api/orders', {
      method: 'POST',
      body: JSON.stringify({ userId: $('user').value, symbol: SYMBOL, side, priceTicks, quantity })
    });
    if (!res.ok) { $('status').textContent = 'rejected: ' + await res.text(); return; }
    const out = await res.json();
    // 202: durably in the order log; fills arrive over the feed as the engine matches.
    $('status').textContent = out.orderId + ': accepted';
    addMine(out.orderId);
    refreshBalances();
  };

  function addMine(orderId) {
    const li = document.createElement('li');
    li.innerHTML = '<span>' + orderId.slice(0, 10) + '…</span>';
    const btn = document.createElement('button');
    btn.textContent = 'cancel';
    btn.onclick = async () => {
      await fetch('/api/cancel', { method: 'POST', body: JSON.stringify({ orderId, userId: $('user').value, symbol: SYMBOL }) });
      li.remove();
      refreshBalances();
    };
    li.appendChild(btn);
    $('mine').appendChild(li);
  }

  // --- live book, maintained client-side from the snapshot+delta feed ---
  const bids = new Map(), asks = new Map();   // priceTicks -> quantity
  let trades = [];

  function applySnapshot(book) {
    bids.clear(); asks.clear();
    book.bids.forEach(l => bids.set(l.priceTicks, l.quantity));
    book.asks.forEach(l => asks.set(l.priceTicks, l.quantity));
    trades = book.trades.slice(0, TAPE);
    render();
  }

  function applyDelta(u) {
    const side = u.side === 'BUY' ? bids : asks;
    if (u.newQuantity === 0) side.delete(u.priceTicks); else side.set(u.priceTicks, u.newQuantity);
    render();
  }

  function applyTrade(t) {
    trades.unshift(t);
    trades = trades.slice(0, TAPE);
    render();
    refreshBalances();   // fills move money; ask TigerBeetle (via the gateway) for the new truth
  }

  function levels(map, descending) {
    return [...map.entries()]
      .sort((a, b) => descending ? b[0] - a[0] : a[0] - b[0])
      .slice(0, DEPTH)
      .map(([priceTicks, quantity]) => ({ priceTicks, quantity }));
  }

  function rows(tbody, list, cls, reverse) {
    const max = Math.max(1, ...list.map(l => l.quantity));
    const ordered = reverse ? [...list].reverse() : list;
    tbody.innerHTML = ordered.map(l =>
      '<tr class="' + cls + '"><td class="px">' + dollars(l.priceTicks) + '</td>' +
      '<td class="lvl">' + l.quantity + '<span class="bar" style="width:' + (l.quantity / max * 100) + '%"></span></td></tr>'
    ).join('');
  }

  function render() {
    const bidLevels = levels(bids, true), askLevels = levels(asks, false);
    rows($('asks'), askLevels, 'ask', true);
    rows($('bids'), bidLevels, 'bid', false);
    $('spread').textContent = bidLevels[0] && askLevels[0]
      ? 'spread ' + dollars(askLevels[0].priceTicks - bidLevels[0].priceTicks)
      : 'spread —';
    $('tape').innerHTML = trades.map(t =>
      '<tr class="' + (t.takerSide === 'BUY' ? 'bid' : 'ask') + '">' +
      '<td class="px">' + dollars(t.priceTicks) + '</td><td>' + t.quantity + '</td></tr>'
    ).join('');
  }

  // --- feed connection: reconnect gets a fresh snapshot, so dropping (or being
  // evicted as a slow consumer) is always recoverable ---
  async function connect() {
    const cfg = await (await fetch('/api/config')).json();
    const ws = new WebSocket('ws://' + location.hostname + ':' + cfg.webSocketPort + '/ws?symbol=' + SYMBOL);
    ws.onopen = () => { $('feed').textContent = 'live'; $('feed').className = 'live'; };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'snapshot') applySnapshot(m.book);
      else if (m.type === 'book') applyDelta(m.update);
      else if (m.type === 'trade') applyTrade(m.trade);
    };
    ws.onclose = () => {
      $('feed').textContent = 'reconnecting'; $('feed').className = 'down';
      setTimeout(connect, 1000);
    };
  }

  // --- balances live in TigerBeetle, not on the kafka feed: fetch on demand ---
  async function refreshBalances() {
    const res = await fetch('/api/balances?userId=' + encodeURIComponent($('user').value));
    if (!res.ok) { $('bal').innerHTML = '<tr><td colspan="3">unavailable</td></tr>'; return; }
    const out = await res.json();
    $('bal').innerHTML = out.balances.map(b => {
      const fmt = v => b.asset === 'USD' ? '$' + dollars(v) : v;
      return '<tr><td>' + b.asset + '</td><td class="avail">' + fmt(b.available) + '</td>' +
        '<td style="color:var(--dim)">' + (b.reserved > 0 ? fmt(b.reserved) + ' held' : '') + '</td></tr>';
    }).join('');
  }
  $('user').onchange = refreshBalances;

  connect();
  refreshBalances();
  setInterval(refreshBalances, 5000);   // settlement lags fills slightly; a slow poll picks up the rest
</script>
</body>
</html>
