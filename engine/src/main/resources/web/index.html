<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>exchange · demo</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --buy:#3fb950; --sell:#f85149; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; padding:16px; }
  h1 { font-size:16px; margin-bottom:2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .cols { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:8px; }
  #ticket { width:220px; }
  #ticket label { display:block; font-size:12px; color:var(--dim); margin:8px 0 2px; }
  #ticket input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; color:var(--text); padding:6px; font:inherit; }
  .sides { display:flex; gap:6px; margin-top:4px; }
  .sides button { flex:1; padding:6px; border-radius:4px; border:1px solid var(--line); background:var(--bg); color:var(--dim); font:inherit; cursor:pointer; }
  .sides button.buy.on { background:var(--buy); border-color:var(--buy); color:#04260d; font-weight:bold; }
  .sides button.sell.on { background:var(--sell); border-color:var(--sell); color:#330503; font-weight:bold; }
  #place { width:100%; margin-top:12px; padding:8px; border:0; border-radius:4px; background:#1f6feb; color:#fff; font:inherit; font-weight:bold; cursor:pointer; }
  #status { font-size:12px; color:var(--dim); margin-top:8px; min-height:18px; }
  #book { width:260px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:1px 6px; text-align:right; font-variant-numeric:tabular-nums; }
  .lvl { position:relative; }
  .lvl .bar { position:absolute; right:0; top:1px; bottom:1px; opacity:.15; }
  .ask td.px { color:var(--sell); } .bid td.px { color:var(--buy); }
  .ask .bar { background:var(--sell); } .bid .bar { background:var(--buy); }
  #spread { text-align:center; color:var(--dim); font-size:12px; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:3px 0; margin:4px 0; }
  #trades { width:220px; }
  #trades td:first-child { text-align:left; }
  #mine li { list-style:none; font-size:12px; color:var(--dim); display:flex; justify-content:space-between; gap:8px; margin-top:4px; }
  #mine button { background:none; border:1px solid var(--line); border-radius:4px; color:var(--dim); font:inherit; font-size:11px; cursor:pointer; }
</style>
</head>
<body>
<h1>exchange</h1>
<div class="sub">BTC-USD · walking-skeleton demo · real matching engine, in-process (no Kafka/TigerBeetle yet)</div>
<div class="cols">
  <div class="panel" id="ticket">
    <h2>Order ticket</h2>
    <label>Trader</label><input id="user" value="alice">
    <div class="sides">
      <button class="buy on" id="btnBuy">BUY</button>
      <button class="sell" id="btnSell">SELL</button>
    </div>
    <label>Limit price ($)</label><input id="price" value="100.00" inputmode="decimal">
    <label>Quantity</label><input id="qty" value="1" inputmode="numeric">
    <button id="place">Place order</button>
    <div id="status"></div>
    <ul id="mine"></ul>
  </div>
  <div class="panel" id="book">
    <h2>Order book</h2>
    <table><tbody id="asks"></tbody></table>
    <div id="spread">—</div>
    <table><tbody id="bids"></tbody></table>
  </div>
  <div class="panel" id="trades">
    <h2>Trades</h2>
    <table><tbody id="tape"></tbody></table>
  </div>
</div>
<script>
  let side = 'BUY';
  const $ = id => document.getElementById(id);
  const dollars = t => (t / 100).toFixed(2);

  $('btnBuy').onclick = () => { side = 'BUY'; $('btnBuy').classList.add('on'); $('btnSell').classList.remove('on'); };
  $('btnSell').onclick = () => { side = 'SELL'; $('btnSell').classList.add('on'); $('btnBuy').classList.remove('on'); };

  $('place').onclick = async () => {
    const priceTicks = Math.round(parseFloat($('price').value) * 100);
    const quantity = parseInt($('qty').value, 10);
    const res = await fetch('/api/orders', {
      method: 'POST',
      body: JSON.stringify({ userId: $('user').value, side, priceTicks, quantity })
    });
    if (!res.ok) { $('status').textContent = 'rejected: ' + await res.text(); return; }
    const out = await res.json();
    const filled = out.fills.reduce((n, f) => n + f.quantity, 0);
    $('status').textContent = out.orderId + ': ' + (filled ? 'filled ' + filled : 'resting');
    if (filled < quantity) addMine(out.orderId);
    refresh();
  };

  function addMine(orderId) {
    const li = document.createElement('li');
    li.innerHTML = '<span>' + orderId + ' resting</span>';
    const btn = document.createElement('button');
    btn.textContent = 'cancel';
    btn.onclick = async () => {
      await fetch('/api/cancel', { method: 'POST', body: JSON.stringify({ orderId, userId: $('user').value }) });
      li.remove();
      refresh();
    };
    li.appendChild(btn);
    $('mine').appendChild(li);
  }

  function rows(tbody, levels, cls, reverse) {
    const max = Math.max(1, ...levels.map(l => l.quantity));
    const list = reverse ? [...levels].reverse() : levels;
    tbody.innerHTML = list.map(l =>
      '<tr class="' + cls + '"><td class="px">' + dollars(l.priceTicks) + '</td>' +
      '<td class="lvl">' + l.quantity + '<span class="bar" style="width:' + (l.quantity / max * 100) + '%"></span></td></tr>'
    ).join('');
  }

  async function refresh() {
    const book = await (await fetch('/api/book')).json();
    rows($('asks'), book.asks, 'ask', true);
    rows($('bids'), book.bids, 'bid', false);
    const bestBid = book.bids[0], bestAsk = book.asks[0];
    $('spread').textContent = bestBid && bestAsk
      ? 'spread ' + dollars(bestAsk.priceTicks - bestBid.priceTicks)
      : 'spread —';
    $('tape').innerHTML = book.trades.map(t =>
      '<tr class="' + (t.takerSide === 'BUY' ? 'bid' : 'ask') + '">' +
      '<td class="px">' + dollars(t.priceTicks) + '</td><td>' + t.quantity + '</td></tr>'
    ).join('');
  }

  refresh();
  setInterval(refresh, 500);
</script>
</body>
</html>
